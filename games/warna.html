<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sortir Warna · Puzzle Santai</title>
<meta name="theme-color" content="#e2572b">
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../style.css">
<style>
  .stage { touch-action: manipulation; }
  .hint { margin: 0; color: var(--muted); font-size: .9rem; text-align: center; }
  .rows { display: flex; flex-direction: column; gap: 18px; width: 100%; align-items: center; }
  .row {
    display: grid;
    grid-template-columns: repeat(var(--per-row), minmax(0, 46px));
    gap: 6px;
    justify-content: center;
    width: 100%;
    padding-top: 40px; /* room for the lifted ball */
  }
  .tube {
    appearance: none;
    position: relative;
    display: flex;
    flex-direction: column-reverse;
    gap: 2px;
    width: 100%;
    aspect-ratio: 1 / 3.75;
    padding: 4px 4px 5px;
    border: 2px solid var(--line);
    border-top-color: transparent;
    border-radius: 6px 6px 22px 22px;
    background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.35) 30%, rgba(255,255,255,.05) 55%, rgba(0,0,0,.04)), var(--surface);
    box-shadow: var(--shadow), inset 0 -6px 10px rgba(0,0,0,.05);
    cursor: pointer;
    touch-action: manipulation;
    font: inherit;
    color: inherit;
  }
  .tube:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tube.sel { border-color: var(--accent); border-top-color: transparent; }
  .ball {
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%), var(--c);
    box-shadow: inset 0 -3px 4px rgba(0,0,0,.18);
    color: rgba(0,0,0,.38);
    font-size: clamp(10px, 3.4vw, 15px);
    line-height: 1;
    transition: transform .16s ease-out;
    pointer-events: none;
  }
  .ball.lift { transform: translateY(calc(-1 * (var(--lift) * (100% + 2px) + 75%))); }
  .ball.drop { animation: drop .2s ease-out; }
  @keyframes drop { from { transform: translateY(-60%); opacity: .4; } to { transform: none; opacity: 1; } }
  .tube.shake { animation: shake .3s; }
  @keyframes shake { 25% { translate: -4px 0; } 50% { translate: 4px 0; } 75% { translate: -2px 0; } }
</style></head>
<body class="game">
<header class="topbar"><a class="back" href="../index.html" aria-label="Kembali ke daftar game">‹</a><h1>Sortir Warna</h1>
<div class="stats"><span>Level <b id="score">1</b></span><span>Terbaik <b id="best">0</b></span></div></header>
<main class="stage">
  <p class="hint">Ketuk tabung, lalu ketuk tujuan. Satu tabung, satu warna.</p>
  <div class="rows" id="board"></div>
</main>
<div class="toolbar"><button class="btn" id="undo">Batal</button><button class="btn" id="extra">+1 Tabung</button><button class="btn" id="restart">Ulang level</button></div>
<dialog class="overlay" id="over"><h2 id="overTitle">Level selesai!</h2><p>Semua warna sudah rapi. Lanjut?</p><button class="btn primary" id="next">Level berikutnya</button></dialog>
<script type="module">
import { CAP, makeLevel, canPour, pour, isSolved } from '../logic/warna.js';
import { getBest, saveBest, registerSW } from '../app.js';
registerSW();

const PALETTE = ['#e5383b', '#f48c06', '#ffd60a', '#70c040', '#1fa5a0', '#3a6ee8', '#8e4bd6', '#f06bb3', '#8d5a3b', '#9aa3ad'];
const SYMBOLS = ['●', '▲', '■', '◆', '★', '✚', '♥', '▼', '✖', '◐'];
const LEVEL_KEY = 'warna:level';
const MAX_PER_ROW = 7;

const $ = (id) => document.getElementById(id);
const board = $('board');
const over = $('over');

let level = 1;
let initial = [];
let tubes = [];
let history = [];
let selected = -1;
let extraUsed = false;
let lastMove = null;

function loadLevelNumber() {
  try {
    const saved = Number(localStorage.getItem(LEVEL_KEY));
    if (saved >= 1) return Math.floor(saved);
  } catch { /* storage blocked: fall back to best */ }
  return getBest('warna') + 1;
}

function saveLevelNumber(n) {
  try { localStorage.setItem(LEVEL_KEY, String(n)); } catch { /* storage blocked: resume not possible */ }
}

function startLevel(n) {
  level = n;
  saveLevelNumber(n);
  initial = makeLevel(n);
  resetLevel();
}

function resetLevel() {
  tubes = initial.map((t) => t.slice());
  history = [];
  selected = -1;
  extraUsed = false;
  lastMove = null;
  render();
}

function makeBall(color, idx, tubeIdx, tube) {
  const ball = document.createElement('span');
  ball.className = 'ball';
  ball.style.setProperty('--c', PALETTE[color]);
  ball.textContent = SYMBOLS[color];
  const isTop = idx === tube.length - 1;
  if (tubeIdx === selected && isTop) {
    ball.classList.add('lift');
    ball.style.setProperty('--lift', CAP - tube.length);
  }
  if (lastMove && lastMove.to === tubeIdx && idx >= tube.length - lastMove.count) ball.classList.add('drop');
  return ball;
}

function makeTube(tube, i) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tube' + (i === selected ? ' sel' : '');
  btn.setAttribute('aria-label', `Tabung ${i + 1}` + (tube.length ? `, ${tube.length} bola` : ', kosong'));
  btn.setAttribute('aria-pressed', String(i === selected));
  btn.dataset.i = i;
  tube.forEach((color, idx) => btn.append(makeBall(color, idx, i, tube)));
  return btn;
}

function render() {
  const perRow = tubes.length <= MAX_PER_ROW - 1 ? tubes.length : Math.ceil(tubes.length / 2);
  board.replaceChildren();
  for (let start = 0; start < tubes.length; start += perRow) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.setProperty('--per-row', perRow);
    tubes.slice(start, start + perRow).forEach((t, k) => row.append(makeTube(t, start + k)));
    board.append(row);
  }
  $('score').textContent = level;
  $('best').textContent = getBest('warna');
  $('undo').disabled = history.length === 0;
  $('extra').disabled = extraUsed;
}

function shake(i) {
  const el = board.querySelector(`[data-i="${i}"]`);
  if (!el) return;
  el.classList.remove('shake');
  void el.offsetWidth; // restart the animation
  el.classList.add('shake');
}

function tryPour(from, to) {
  if (!canPour(tubes, from, to)) { shake(to); return; }
  const before = tubes[to].length;
  history.push(tubes);
  tubes = pour(tubes, from, to);
  lastMove = { to, count: tubes[to].length - before };
  selected = -1;
  render();
  if (isSolved(tubes)) win();
}

function onTubeTap(i) {
  lastMove = null;
  if (selected === -1) {
    if (tubes[i].length === 0) { shake(i); return; }
    selected = i;
  } else if (selected === i) {
    selected = -1;
  } else {
    tryPour(selected, i);
    return;
  }
  render();
}

function win() {
  $('best').textContent = saveBest('warna', level);
  $('overTitle').textContent = `Level ${level} selesai!`;
  over.showModal();
}

board.addEventListener('click', (e) => {
  const btn = e.target.closest('.tube');
  if (btn) onTubeTap(Number(btn.dataset.i));
});

$('undo').addEventListener('click', () => {
  if (!history.length) return;
  tubes = history.pop();
  selected = -1;
  lastMove = null;
  render();
});

$('extra').addEventListener('click', () => {
  if (extraUsed) return;
  extraUsed = true;
  tubes = [...tubes, []];
  history = history.map((h) => [...h, []]); // keep the extra tube when undoing
  lastMove = null;
  render();
});

$('restart').addEventListener('click', resetLevel);
$('next').addEventListener('click', () => over.close());
over.addEventListener('close', () => startLevel(level + 1));

startLevel(loadLevelNumber());
</script></body></html>
